<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GateFood - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }
    input:focus {
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
    }
  </style>
</head>
<body class="h-full bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Glassmorphic Card -->
    <div class="glass rounded-3xl p-8 md:p-10 shadow-2xl">

      <!-- Logo / Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-2xl mb-4 backdrop-blur-sm">
          <i class="fas fa-door-open text-3xl text-white"></i>
        </div>
        <h1 class="text-3xl font-bold text-white tracking-tight">Welcome Back</h1>
        <p class="text-blue-200 mt-2 text-sm">Sign in to order food to your block or cafeteria</p>
      </div>

      <!-- Form -->
      <form class="space-y-6">
        <!-- Input: Phone/Email -->
        <div>
          <label class="block text-white/90 text-sm font-medium mb-2">Phone or Email</label>
          <input 
            type="text" 
            placeholder="024 123 4567 or your@email.com"
            class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder:text-white/50 focus:bg-white/15 transition-all outline-none"
            required
          />
        </div>

        <!-- Input: Password with toggle -->
        <div class="relative">
          <label class="block text-white/90 text-sm font-medium mb-2">Password</label>
          <input 
            type="password" 
            id="password"
            placeholder="••••••••"
            class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder:text-white/50 focus:bg-white/15 transition-all outline-none pr-12"
            required
          />
          <button 
            type="button" 
            onclick="togglePassword()"
            class="absolute right-4 top-10 text-white/70 hover:text-white transition"
          >
            <i class="fas fa-eye text-xl" id="eye-icon"></i>
          </button>
        </div>

        <!-- Forgot link -->
        <div class="text-right">
          <a href="#" class="text-blue-300 hover:text-blue-200 text-sm transition">Forgot password?</a>
        </div>

        <!-- Error placeholder (show via JS later) -->
        <div id="error" class="hidden bg-red-500/20 border border-red-400/50 text-red-200 px-4 py-3 rounded-2xl text-center text-sm">
          Invalid credentials. Please try again.
        </div>

        <!-- Login Button -->
        <button 
          type="submit"
          class="w-full bg-white text-blue-900 py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-gray-100 active:scale-95 transition transform duration-150"
        >
          Login
        </button>
      </form>

      <!-- Divider -->
      <div class="my-6 flex items-center">
        <div class="flex-1 h-px bg-white/20"></div>
        <span class="px-4 text-white/60 text-sm">or</span>
        <div class="flex-1 h-px bg-white/20"></div>
      </div>

      <!-- Sign Up link -->
      <p class="text-center text-white/80 text-sm">
        Don't have an account? 
        <a href="#" class="text-white font-medium hover:text-blue-200 transition">Sign Up</a>
      </p>

    </div>

    <!-- Back link -->
    <div class="text-center mt-6">
      <a href="home.html" class="text-blue-300 hover:text-white text-sm flex items-center justify-center gap-2 transition">
        <i class="fas fa-arrow-left"></i> Back to home
      </a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>

</body>
</html>
