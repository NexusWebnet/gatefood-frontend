<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GateFood - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }
    input:focus, select:focus {
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
    }
    .hidden { display: none; }
    /* Styled Google button - matches official look */
    .google-btn {
      background-color: white;
      color: #1f2937;
      border: 1px solid #d1d5db;
      border-radius: 9999px;
      font-weight: 500;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .google-btn:hover {
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }
    .google-btn:active {
      background-color: #f3f4f6;
      transform: scale(0.98);
    }
  </style>
</head>
<body class="h-full bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="glass rounded-3xl p-8 md:p-10 shadow-2xl">

      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-2xl mb-4 backdrop-blur-sm">
          <i class="fas fa-user-plus text-3xl text-white"></i>
        </div>
        <h1 class="text-3xl font-bold text-white tracking-tight">Create Account</h1>
        <p class="text-blue-200 mt-2 text-sm">Join GateFood – order food right to your block</p>
      </div>

      <!-- Google Sign Up Button (styled placeholder – no external script) -->
      <button 
        type="button"
        class="google-btn w-full flex items-center justify-center gap-3 py-3.5 px-6 mb-6 text-base font-medium"
        onclick="alert('Google Sign Up clicked! In the real version this would open the Google popup and send the token to your backend.')"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.51h5.84c-.25 1.48-.98 2.73-2.08 3.58v2.86h3.36c1.97-1.81 3.1-4.48 3.1-7.7z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-1.01 7.28-2.73l-3.36-2.86c-.93.63-2.12 1-3.92 1-3.01 0-5.56-2.03-6.47-4.76H.96v2.99C2.59 20.59 6.7 23 12 23z" fill="#34A853"/>
          <path d="M5.53 14.25c-.23-.69-.36-1.43-.36-2.25s.13-1.56.36-2.25V6.76H.96C.35 8.09 0 10 0 12s.35 3.91.96 5.24l4.57-3z" fill="#FBBC05"/>
          <path d="M12 4.98c1.64 0 3.11.56 4.27 1.66l3.19-3.19C17.46 1.01 14.97 0 12 0 6.7 0 2.59 2.41.96 6.76l4.57 3C6.44 7.01 8.99 4.98 12 4.98z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </button>

      <!-- Divider -->
      <div class="flex items-center mb-6">
        <div class="flex-1 h-px bg-white/20"></div>
        <span class="px-4 text-white/60 text-sm">or use email/phone</span>
        <div class="flex-1 h-px bg-white/20"></div>
      </div>

      <!-- Rest of the form remains the same -->
      <form class="space-y-6" id="signupForm">
        <div>
          <label class="block text-white/90 text-sm font-medium mb-2">Full Name</label>
          <input type="text" placeholder="Charles Ofori" required class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder:text-white/50 focus:bg-white/15 transition-all outline-none" />
        </div>

        <div>
          <label class="block text-white/90 text-sm font-medium mb-2">Phone Number</label>
          <input type="tel" placeholder="024 123 4567" required class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder:text-white/50 focus:bg-white/15 transition-all outline-none" />
        </div>

        <div>
          <label class="block text-white/90 text-sm font-medium mb-2">Email (optional)</label>
          <input type="email" placeholder="you@example.com" class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder:text-white/50 focus:bg-white/15 transition-all outline-none" />
        </div>

        <div class="relative">
          <label class="block text-white/90 text-sm font-medium mb-2">Password</label>
          <input type="password" id="password" placeholder="Create a strong password" required class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder:text-white/50 focus:bg-white/15 transition-all outline-none pr-12" />
          <button type="button" onclick="togglePassword('password', 'eye-icon')" class="absolute right-4 top-10 text-white/70 hover:text-white transition">
            <i class="fas fa-eye text-xl" id="eye-icon"></i>
          </button>
        </div>

        <div class="relative">
          <label class="block text-white/90 text-sm font-medium mb-2">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder:text-white/50 focus:bg-white/15 transition-all outline-none pr-12" />
          <button type="button" onclick="togglePassword('confirmPassword', 'eye-icon-confirm')" class="absolute right-4 top-10 text-white/70 hover:text-white transition">
            <i class="fas fa-eye text-xl" id="eye-icon-confirm"></i>
          </button>
        </div>

        <div>
          <label class="block text-white/90 text-sm font-medium mb-2">Your Block</label>
          <div class="grid grid-cols-3 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="block" value="Block 1" class="sr-only peer" onchange="toggleFloor()" required />
              <div class="w-full py-3 bg-white/10 border border-white/20 rounded-xl text-center text-white peer-checked:bg-blue-600 peer-checked:border-blue-400 hover:bg-white/15 transition text-sm font-medium">
                Block 1
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="block" value="Block 2" class="sr-only peer" onchange="toggleFloor()" />
              <div class="w-full py-3 bg-white/10 border border-white/20 rounded-xl text-center text-white peer-checked:bg-blue-600 peer-checked:border-blue-400 hover:bg-white/15 transition text-sm font-medium">
                Block 2
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="block" value="Cafeteria" class="sr-only peer" onchange="toggleFloor()" />
              <div class="w-full py-3 bg-white/10 border border-white/20 rounded-xl text-center text-white peer-checked:bg-blue-600 peer-checked:border-blue-400 hover:bg-white/15 transition text-sm font-medium">
                Cafeteria
              </div>
            </label>
          </div>
        </div>

        <div id="floorSection" class="hidden">
          <label class="block text-white/90 text-sm font-medium mb-2">Floor (1–6)</label>
          <select class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-2xl text-white focus:bg-white/15 transition-all outline-none">
            <option value="">Select floor</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </div>

        <div>
          <label class="block text-white/90 text-sm font-medium mb-2">Room / Note (optional)</label>
          <input type="text" placeholder="e.g. Room 305 or Ask for security" class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder:text-white/50 focus:bg-white/15 transition-all outline-none" />
        </div>

        <div id="passwordError" class="hidden bg-red-500/20 border border-red-400/50 text-red-200 px-4 py-3 rounded-2xl text-center text-sm">
          Passwords do not match.
        </div>

        <button type="submit" class="w-full bg-white text-blue-900 py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-gray-100 active:scale-95 transition transform duration-150">
          Create Account
        </button>
      </form>

      <p class="text-center text-white/80 text-sm mt-6">
        Already have an account? 
        <a href="login-resident.html" class="text-white font-medium hover:text-blue-200 transition">Login</a>
      </p>

    </div>

    <div class="text-center mt-6">
      <a href="home.html" class="text-blue-300 hover:text-white text-sm flex items-center justify-center gap-2 transition">
        <i class="fas fa-arrow-left"></i> Back to home
      </a>
    </div>
  </div>

  <script>
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.classList.toggle('fa-eye');
      icon.classList.toggle('fa-eye-slash');
    }

    function toggleFloor() {
      const selected = document.querySelector('input[name="block"]:checked')?.value;
      document.getElementById('floorSection').classList.toggle('hidden', !['Block 1', 'Block 2'].includes(selected));
    }

    document.getElementById('signupForm').addEventListener('submit', e => {
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const error = document.getElementById('passwordError');
      if (pass !== confirm) {
        e.preventDefault();
        error.classList.remove('hidden');
      } else {
        error.classList.add('hidden');
      }
    });
  </script>

</body>
</html>
